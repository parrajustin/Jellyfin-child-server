name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate the e2e golden screenshots (download the e2e-screenshots artifact and commit it)
        type: boolean
        default: false
        required: false
      release:
        description: Run ./release (every suite, then build and tag the Alpine image)
        type: boolean
        default: false
        required: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  SDK_VERSION: "10.0.x"

jobs:
  unit-tests:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - name: Build
        run: dotnet build Jellyfin.sln --configuration Release

      - name: Test
        run: >
          dotnet test Jellyfin.sln
          --configuration Release
          --no-build
          --verbosity minimal

  e2e:
    name: End-to-end (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@v3

      - name: Build the child server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: jellyfin-child-server:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run the end-to-end suite
        env:
          E2E_SKIP_CHILD_BUILD: "1"
          UPDATE_SNAPSHOTS: ${{ github.event.inputs.update_snapshots }}
        run: |
          args=()
          if [ "$UPDATE_SNAPSHOTS" = "true" ]; then
            args+=(--update-snapshots)
          fi
          bash tests/e2e/run.sh "${args[@]}"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: tests/e2e/test-results
          if-no-files-found: ignore

      - name: Upload golden screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: tests/e2e/specs/__screenshots__
          if-no-files-found: ignore

  release:
    name: Release (./release)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.SDK_VERSION }}

      - uses: docker/setup-buildx-action@v3

      # ./release runs the unit and integration suites, then the Docker browser suite, and only
      # then builds and tags the Alpine image. It fails the job at the first step that fails.
      - name: Release
        run: bash ./release

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-e2e-results
          path: tests/e2e/test-results
          if-no-files-found: ignore
